<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- Direct-play CDNs (e.g. hakunaymatata) reject any Referer header (429),
         which surfaces as a <video> MEDIA_ERR_SRC_NOT_SUPPORTED (code 4). Send
         no referrer so cross-origin stream requests are accepted. Same-origin
         /api routes don't rely on Referer, so this is safe app-wide. -->
    <meta name="referrer" content="no-referrer" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.svg" type="image/svg+xml" />
    <link rel="alternate icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0a0a0a" />
    <meta
      name="description"
      content="Whether you're searching for the latest blockbuster or discovering a hidden gem, FreeMovies has you covered. Stream content from multiple servers and watch trailers instantly to make your viewing decisions effortless."
    />
    <meta
      name="keywords"
      content="FreeMovies, watch movies online, stream TV series, watch anime online, movie trailers, HD streaming, free movies, discover movies"
    />
    <meta name="author" content="FreeMovies" />
    <meta
      name="robots"
      content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1"
    />
    <link rel="canonical" href="https://scenic-stream.vercel.app/" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@1,9..144,900&display=swap"
      rel="stylesheet"
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="FreeMovies" />
    <meta property="og:title" content="FreeMovies - Stream movies & TV instantly" />
    <meta property="og:description" content="Whether you're searching for the latest blockbuster or discovering a hidden gem, FreeMovies has you covered. Stream content from multiple servers and watch trailers instantly to make your viewing decisions effortless." />
    <meta property="og:url" content="https://scenic-stream.vercel.app/" />
    <meta property="og:image" content="%PUBLIC_URL%/logo.svg" />
    <meta property="og:image:alt" content="FreeMovies - stream movies, TV series and anime" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="FreeMovies - Stream movies & TV instantly" />
    <meta name="twitter:description" content="Whether you're searching for the latest blockbuster or discovering a hidden gem, FreeMovies has you covered. Stream content from multiple servers and watch trailers instantly to make your viewing decisions effortless." />
    <meta name="twitter:image" content="https://scenic-stream.vercel.app/logo.svg" />
    <!--
      manifest.json provides metadata used when your web app is installed on a
      user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
    -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <!--
      Notice the use of %PUBLIC_URL% in the tags above.
      It will be replaced with the URL of the `public` folder during the build.
      Only files inside the `public` folder can be referenced from the HTML.

      Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
      work correctly both with client-side routing and a non-root public URL.
      Learn how to configure a non-root public URL by running `npm run build`.
    -->
    <title>FreeMovies - Stream Movies, TV Series & Anime</title>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "FreeMovies",
        "alternateName": "FreeMovies Stream",
        "url": "https://scenic-stream.vercel.app/",
        "description": "Stream movies, TV series and anime, watch trailers, and discover what to watch next.",
        "potentialAction": {
          "@type": "SearchAction",
          "target": "https://scenic-stream.vercel.app/search/{search_term_string}",
          "query-input": "required name=search_term_string"
        }
      }
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "FreeMovies",
        "url": "https://scenic-stream.vercel.app/",
        "logo": "https://scenic-stream.vercel.app/logo.svg",
        "description": "Free streaming platform for movies, TV series and anime."
      }
    </script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <!--
      This HTML file is a template.
      If you open it directly in the browser, you will see an empty page.

      You can add webfonts, meta tags, or analytics to this file.
      The build step will place the bundled scripts into the <body> tag.

      To begin the development, run `npm start` or `yarn start`.
      To create a production bundle, use `npm run build` or `yarn build`.
    -->
  </body>
</html>
