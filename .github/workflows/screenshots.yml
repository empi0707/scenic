name: Refresh screenshots

# Recapture the README screenshots from the live site every 7 days, and
# commit them if anything changed. Can also be run manually from the Actions tab.
on:
  schedule:
    - cron: "0 6 * * 1" # every Monday 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  screenshots:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Capture screenshots
        run: node scripts/screenshots.mjs
        env:
          SCENIC_URL: https://scenic-stream.vercel.app

      - name: Commit updated screenshots
        run: |
          git config user.name "Vanshaj Pahwa"
          git config user.email "vanshajpahwa07@gmail.com"
          git add docs/screenshots
          if git diff --staged --quiet; then
            echo "No screenshot changes."
          else
            git commit -m "chore: refresh README screenshots"
            git push
          fi
